server {
    listen 80;
    server_name _;

    # Root directory where our HTML/CSS/JS files live
    root /usr/share/nginx/html;
    index index.html;


    # ============================================================
    # API ROUTING
    # ============================================================
    # Requests beginning with /api/v1/auth/ are forwarded
    # to the Kubernetes auth-service.
    #
    # Example:
    # Browser:
    #   POST /api/v1/auth/register/
    #
    # NGINX:
    #   auth-service:8000/api/v1/auth/register/
    # ============================================================

    location /api/v1/auth/ {
        proxy_pass http://auth-service:8000/api/v1/auth/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ============================================================
    # STATIC FRONTEND
    # ============================================================

    # Serve static files with smart fallback
    # 1. Try exact file
    # 2. Try directory
    # 3. Try .html
    # 4. Fallback to index.html

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }


    # ============================================================
    # STATIC ASSET CACHE
    # ============================================================

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }


    # ============================================================
    # SECURITY HEADERS
    # ============================================================

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";


    # ============================================================
    # LOGGING
    # ============================================================

    # Send logs to stdout/stderr so Kubernetes captures them.
    access_log /dev/stdout;
    error_log /dev/stderr;
}
